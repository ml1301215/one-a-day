<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171614"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8172"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#175F5A"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A0742A"/></marker><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F6F1E6" stroke="none" stroke-width="1" opacity="1"/><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#171614" stroke="none" stroke-width="1" opacity="0.028"/><rect x="0" y="0" width="1600" height="1000" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply"/><line x1="27" y1="34" x2="41" y2="34" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="34" y1="27" x2="34" y2="41" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1559" y1="34" x2="1573" y2="34" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1566" y1="27" x2="1566" y2="41" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="27" y1="966" x2="41" y2="966" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="34" y1="959" x2="34" y2="973" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1559" y1="966" x2="1573" y2="966" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1566" y1="959" x2="1566" y2="973" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><text x="72" y="62" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="2.42" opacity="1">FIG. 04</text><text x="1528" y="62" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="end" letter-spacing="1.6" opacity="1">一日一片 / OneADay — v4 架构</text><text x="72" y="128" font-family="'Noto Serif SC', Georgia, serif" font-size="44" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">语料、边界，和一次诚实对账</text><text x="72" y="168" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">没有中文逐字稿，所以这份人格是「观众实际感知到的他」；每个数字都标了 n，可以被推翻。</text><line x1="72" y1="200" x2="1528" y2="200" stroke="#171614" stroke-width="1.4" opacity="0.85"/><text x="72" y="252" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="2.42" opacity="1">TRACK A · 弹幕</text><text x="204" y="252" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">观众边听边打，是二手材料</text><rect x="72" y="272" width="206" height="104" rx="3" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="88" y="320" font-family="'Noto Serif SC', Georgia, serif" font-size="30" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">19,553</text><text x="88" y="342" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">条带时间轴弹幕</text><text x="88" y="360" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">20 个投稿</text><path d="M 280 324 L 296 324" fill="none" stroke="#8A8172" stroke-width="1.2" marker-end="url(#ah-muted)" opacity="1"/><rect x="298" y="272" width="206" height="104" rx="3" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="314" y="320" font-family="'Noto Serif SC', Georgia, serif" font-size="30" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">8,090</text><text x="314" y="342" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">条进入聚簇</text><text x="314" y="360" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">去掉 9,896 条纯情绪</text><path d="M 506 324 L 522 324" fill="none" stroke="#8A8172" stroke-width="1.2" marker-end="url(#ah-muted)" opacity="1"/><rect x="524" y="272" width="206" height="104" rx="3" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="540" y="320" font-family="'Noto Serif SC', Georgia, serif" font-size="30" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">189</text><text x="540" y="342" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">个多片段时间簇</text><text x="540" y="360" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">时间差 ≤ 2.5s + 语义桥</text><path d="M 732 324 L 748 324" fill="none" stroke="#8A8172" stroke-width="1.2" marker-end="url(#ah-muted)" opacity="1"/><rect x="750" y="272" width="206" height="104" rx="3" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="766" y="320" font-family="'Noto Serif SC', Georgia, serif" font-size="30" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">115</text><text x="766" y="342" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">条转写 utterance</text><text x="766" y="360" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">抽检 10 条只有 2–3 条像人话</text><text x="72" y="432" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#A0742A" text-anchor="start" letter-spacing="2.42" opacity="1">TRACK B · 评论</text><text x="204" y="432" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">10,972 条里，有 223 条是他自己敲的</text><rect x="72" y="452" width="206" height="104" rx="3" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="88" y="500" font-family="'Noto Serif SC', Georgia, serif" font-size="30" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">10,972</text><text x="88" y="522" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">条评论（主 + 二级）</text><text x="88" y="540" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">已全量翻过一遍，不是抽样</text><path d="M 280 504 L 300 504" fill="none" stroke="#A0742A" stroke-width="1.2" marker-end="url(#ah-muted)" opacity="1"/><rect x="302" y="450" width="360" height="112" rx="3" fill="#171614" stroke="#171614" stroke-width="1" opacity="1"/><text x="318" y="496" font-family="'Noto Serif SC', Georgia, serif" font-size="34" font-weight="600" fill="#F6F1E6" text-anchor="start" letter-spacing="0" opacity="1">223</text><text x="386" y="496" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#F6F1E6" text-anchor="start" letter-spacing="0" opacity="1">条他本人敲的中文</text><text x="318" y="520" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#BFB49E" text-anchor="start" letter-spacing="0" opacity="1">本机唯一的一手材料：不经「观众转写」损耗</text><text x="318" y="540" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#BFB49E" text-anchor="start" letter-spacing="0" opacity="1">中位 9 字 · 91% 不带句末标点 → 只量语体，不量长度</text><text x="700" y="476" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#C0392B" text-anchor="start" letter-spacing="2.42" opacity="1">FALSIFIED</text><text x="700" y="510" font-family="'Noto Serif SC', Georgia, serif" font-size="16" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">「10972 条评论里，他本人出现 0 次」</text><line x1="698" y1="505" x2="1022" y2="505" stroke="#C0392B" stroke-width="1.6" opacity="1"/><text x="700" y="536" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">这句话曾被人格包当成行为依据（「他不回评论，所以不追问后续」）。</text><text x="700" y="554" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">复算后：223 条。结论的方向没错，但理由一直是错的。</text><text x="1008" y="252" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#8A8172" text-anchor="start" letter-spacing="2.42" opacity="1">ARTIFACTS</text><rect x="1008" y="272" width="520" height="52" rx="3" fill="#FBF7EC" stroke="#171614" stroke-width="1" opacity="1"/><text x="1026" y="294" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">texture.json</text><text x="1026" y="312" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">统计画像 · 每个数字带 n 与置信</text><rect x="1008" y="334" width="520" height="52" rx="3" fill="#FBF7EC" stroke="#171614" stroke-width="1" opacity="1"/><text x="1026" y="356" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">shotbank.jsonl</text><text x="1026" y="374" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">55 条原创样本 · 话题 × 形态</text><rect x="1008" y="396" width="520" height="52" rx="3" fill="#FBF7EC" stroke="#171614" stroke-width="1" opacity="1"/><text x="1026" y="418" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">report.md</text><text x="1026" y="436" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">29 条结论对账 · 含「最可能错在哪」</text><text x="1008" y="480" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">产物入库，缓存不入库；改数据就重跑，别手改。</text><line x1="72" y1="588" x2="1528" y2="588" stroke="#171614" stroke-width="1.2" opacity="1"/><text x="72" y="626" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="0" opacity="1">拿到了什么</text><text x="72" y="652" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">· 19,553 条带时间轴弹幕（11 支被抽样到 1200 条）</text><text x="72" y="672" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">· 10,972 条评论（含 223 条他本人的）</text><text x="72" y="692" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">· 20 个投稿标题 · 7 个合集名</text><text x="72" y="712" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">· 3 份英文机器翻译字幕（只量结构，不回译）</text><text x="592" y="626" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">没拿到什么（以及为什么）</text><text x="592" y="652" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="610" y="652" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="500" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">中文逐字稿</text><text x="742" y="652" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">20 个投稿里 17 个没有字幕，3 个只有 ai-en</text><text x="592" y="672" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="610" y="672" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="500" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">音轨 / 自建 ASR</text><text x="742" y="672" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">下载被运行环境拦下（HTTP 567），未绕过</text><text x="592" y="692" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="610" y="692" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="500" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">简介 · 动态 · 专栏</text><text x="742" y="692" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">简介全空，动态只有自动转发</text><text x="592" y="712" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="610" y="712" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="500" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">45 个标题的完整清单</text><text x="742" y="712" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">本机只能解析到 20 个</text><text x="72" y="768" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">旧文档 29 条结论，逐条复算</text><rect x="72" y="780" width="460.44827586206895" height="12" rx="1" fill="#175F5A" stroke="none" stroke-width="1" opacity="1"/><rect x="535.448275862069" y="780" width="499.0689655172414" height="12" rx="1" fill="#C0392B" stroke="none" stroke-width="1" opacity="1"/><rect x="1037.5172413793102" y="780" width="112.86206896551724" height="12" rx="1" fill="#A0742A" stroke="none" stroke-width="1" opacity="1"/><rect x="1153.3793103448274" y="780" width="35.62068965517241" height="12" rx="1" fill="#8A8172" stroke="none" stroke-width="1" opacity="1"/><circle cx="75" cy="818" r="3" fill="#175F5A"/><text x="85" y="822" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">一致</text><text x="85" y="840" font-family="'Noto Serif SC', Georgia, serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">12</text><circle cx="255" cy="818" r="3" fill="#C0392B"/><text x="265" y="822" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">不一致</text><text x="265" y="840" font-family="'Noto Serif SC', Georgia, serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">13</text><circle cx="435" cy="818" r="3" fill="#A0742A"/><text x="445" y="822" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">方法伪影</text><text x="445" y="840" font-family="'Noto Serif SC', Georgia, serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">3</text><circle cx="615" cy="818" r="3" fill="#8A8172"/><text x="625" y="822" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">无法判定</text><text x="625" y="840" font-family="'Noto Serif SC', Georgia, serif" font-size="14" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">1</text><line x1="72" y1="926" x2="1528" y2="926" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="72" y="954" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">最值钱的不是那 19,553 条弹幕，而是 223 条他自己敲的字——以及那份写清「这套方法最可能错在哪」的报告。</text><text x="1528" y="954" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="600" fill="#8A8172" text-anchor="end" letter-spacing="1.98" opacity="1">ONE A DAY · ARCHITECTURE</text></svg>