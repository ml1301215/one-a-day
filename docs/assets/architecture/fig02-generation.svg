<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171614"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8172"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#175F5A"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A0742A"/></marker><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F6F1E6" stroke="none" stroke-width="1" opacity="1"/><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#171614" stroke="none" stroke-width="1" opacity="0.028"/><rect x="0" y="0" width="1600" height="1000" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply"/><line x1="27" y1="34" x2="41" y2="34" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="34" y1="27" x2="34" y2="41" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1559" y1="34" x2="1573" y2="34" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1566" y1="27" x2="1566" y2="41" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="27" y1="966" x2="41" y2="966" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="34" y1="959" x2="34" y2="973" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1559" y1="966" x2="1573" y2="966" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1566" y1="959" x2="1566" y2="973" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><text x="72" y="62" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="2.42" opacity="1">FIG. 02</text><text x="1528" y="62" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="end" letter-spacing="1.6" opacity="1">一日一片 / OneADay — v4 架构</text><text x="72" y="128" font-family="'Noto Serif SC', Georgia, serif" font-size="44" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">一轮请求的七拍</text><text x="72" y="168" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">真正让行为变的是第五拍和那条重试通道——prompt 改十次，不如在这里换一条。</text><line x1="72" y1="200" x2="1528" y2="200" stroke="#171614" stroke-width="1.4" opacity="0.85"/><line x1="96" y1="262" x2="96" y2="762" stroke="#D7CDB8" stroke-width="1" opacity="1"/><circle cx="96" cy="272" r="13" fill="none" stroke="#C0392B" stroke-width="1.2"/><text x="96" y="276.5" font-family="'Noto Serif SC', Georgia, serif" font-size="12.5" font-weight="600" fill="#C0392B" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="124" y="277" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">限流</text><text x="124" y="297" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">device 级滑动窗口；429 就直接回，不进模型</text><line x1="124" y1="330" x2="632" y2="330" stroke="#D7CDB8" stroke-width="1" opacity="0.55"/><circle cx="96" cy="352" r="13" fill="none" stroke="#175F5A" stroke-width="1.2"/><text x="96" y="356.5" font-family="'Noto Serif SC', Georgia, serif" font-size="12.5" font-weight="600" fill="#175F5A" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="124" y="357" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">检索样本</text><text x="124" y="377" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">voice/retrieval：按用户原话判话题，取 4 条；上一条已自述 → 整批撤掉讲自己的样本</text><line x1="124" y1="410" x2="632" y2="410" stroke="#D7CDB8" stroke-width="1" opacity="0.55"/><circle cx="96" cy="432" r="13" fill="none" stroke="#175F5A" stroke-width="1.2"/><text x="96" y="436.5" font-family="'Noto Serif SC', Georgia, serif" font-size="12.5" font-weight="600" fill="#175F5A" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="124" y="437" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">编译 prompt</text><text x="124" y="457" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">人格 × 纹理 × 样本；同一轮 N 条候选各带一句不同的「形状指令」</text><line x1="124" y1="490" x2="632" y2="490" stroke="#D7CDB8" stroke-width="1" opacity="0.55"/><circle cx="96" cy="512" r="13" fill="none" stroke="#175F5A" stroke-width="1.2"/><text x="96" y="516.5" font-family="'Noto Serif SC', Georgia, serif" font-size="12.5" font-weight="600" fill="#175F5A" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="124" y="517" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">并行生成</text><text x="124" y="537" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">provider ×3，温度轻微抖动（0.84 / 0.90 / 0.96）</text><line x1="124" y1="570" x2="632" y2="570" stroke="#D7CDB8" stroke-width="1" opacity="0.55"/><circle cx="96" cy="592" r="13" fill="none" stroke="#175F5A" stroke-width="1.2"/><text x="96" y="596.5" font-family="'Noto Serif SC', Georgia, serif" font-size="12.5" font-weight="600" fill="#175F5A" text-anchor="middle" letter-spacing="0" opacity="1">5</text><text x="124" y="597" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">打分重排</text><text x="124" y="617" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">voice/scorer：形状拟合 + 惩罚项，挑 1 条；全出局时按「错误最轻」退回</text><line x1="124" y1="650" x2="632" y2="650" stroke="#D7CDB8" stroke-width="1" opacity="0.55"/><circle cx="96" cy="672" r="13" fill="none" stroke="#175F5A" stroke-width="1.2"/><text x="96" y="676.5" font-family="'Noto Serif SC', Georgia, serif" font-size="12.5" font-weight="600" fill="#175F5A" text-anchor="middle" letter-spacing="0" opacity="1">6</text><text x="124" y="677" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">格式闸门</text><text x="124" y="697" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">只拦 emoji / Markdown / 分点列表 / 空回复 / 助手腔 / 照抄</text><line x1="124" y1="730" x2="632" y2="730" stroke="#D7CDB8" stroke-width="1" opacity="0.55"/><circle cx="96" cy="752" r="13" fill="none" stroke="#C0392B" stroke-width="1.2"/><text x="96" y="756.5" font-family="'Noto Serif SC', Georgia, serif" font-size="12.5" font-weight="600" fill="#C0392B" text-anchor="middle" letter-spacing="0" opacity="1">7</text><text x="124" y="757" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">落库回放</text><text x="124" y="777" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">记消息与梗指纹 → 按 2 字 / 12ms 回放成 SSE；meta 在生成之前就先发</text><line x1="72" y1="812" x2="632" y2="812" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="72" y="840" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#C0392B" text-anchor="start" letter-spacing="2.42" opacity="1">COST</text><text x="130" y="840" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">每轮 3 次模型调用；触发重试时 6 次。这就是 OAD_CANDIDATES 默认 3、不是 5 的原因。</text><text x="744" y="268" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="2.42" opacity="1">RERANK</text><text x="830" y="268" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">同轮 3 条候选，只发 1 条</text><rect x="744" y="288" width="784" height="186" rx="3" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><rect x="745" y="292" width="782" height="44" rx="2" fill="#171614" stroke="none" stroke-width="1" opacity="1"/><text x="762" y="314" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#BFB49E" text-anchor="start" letter-spacing="1.2" opacity="1">★ 挑中</text><text x="762" y="330" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#F6F1E6" text-anchor="start" letter-spacing="0" opacity="1">第 1 条</text><rect x="894" y="314" width="399.5" height="12" rx="1" fill="none" stroke="#F6F1E6" stroke-width="1" opacity="1"/><rect x="895.5" y="315.5" width="396.5" height="9" rx="1" fill="#F6F1E6" stroke="none" stroke-width="1" opacity="1"/><text x="1510" y="322" font-family="'Noto Serif SC', Georgia, serif" font-size="17" font-weight="600" fill="#F6F1E6" text-anchor="end" letter-spacing="0" opacity="1">+4.25</text><text x="762" y="366" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="1.2" opacity="1">候选</text><text x="762" y="382" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">第 2 条</text><rect x="894" y="366" width="222.78000000000003" height="12" rx="1" fill="#D7CDB8" stroke="none" stroke-width="1" opacity="1"/><text x="1510" y="374" font-family="'Noto Serif SC', Georgia, serif" font-size="17" font-weight="600" fill="#171614" text-anchor="end" letter-spacing="0" opacity="1">+2.37</text><text x="762" y="418" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="1.2" opacity="1">候选</text><text x="762" y="434" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">第 3 条</text><text x="894" y="426" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">出局：照抄示例（改一两个字也抓得到）</text><text x="762" y="462" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">分数 = 离真实分布的拟合 + 惩罚项；绝对值没有意义，只作同轮比较。</text><text x="744" y="512" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#C0392B" text-anchor="start" letter-spacing="2.42" opacity="1">REJECT</text><text x="820" y="512" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">命中即弃，不参与边际比较</text><text x="748" y="542" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="768" y="542" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">解释自己的梗（「一个音」「念起来像」）</text><text x="748" y="572" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="768" y="572" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">连着两条讲自己（单条不算，抢戏才算）</text><text x="748" y="602" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="768" y="602" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">照抄示例：最长公共子串 ≥ 12 字且覆盖 ≥ 70%</text><text x="748" y="632" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="768" y="632" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">用户说一整件事，只回一句（&lt; 12 字）</text><text x="748" y="662" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="768" y="662" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">emoji / Markdown / 分点列表 / 助手腔</text><rect x="744" y="700" width="784" height="176" rx="3" fill="none" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="5 4" opacity="1"/><text x="762" y="724" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#C0392B" text-anchor="start" letter-spacing="2.42" opacity="1">RETRY</text><text x="822" y="724" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">三条候选全在抄样本 —— 问题不在候选，在样本</text><rect x="762" y="744" width="218" height="56" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="774" y="766" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">3 条候选</text><text x="774" y="784" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">全判「照抄示例」</text><path d="M 982 772 L 1020 772" fill="none" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah-red)" opacity="1"/><rect x="1006" y="744" width="218" height="56" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="1018" y="766" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">要不要再写一条规则？</text><text x="1018" y="784" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">不。规则打不过样本</text><path d="M 1226 772 L 1264 772" fill="none" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah-red)" opacity="1"/><rect x="1270" y="744" width="218" height="56" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="1282" y="766" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">撤掉样本，再要一轮</text><text x="1282" y="784" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">同一轮里只重试一次</text><text x="762" y="826" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">实测触发场景：辞职、催婚、大家庭——越对题的样本，越容易被当成台词背下来。</text><text x="762" y="848" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">这条通道只对「抄」生效，不对「写得不好」生效——后者交给下一轮对话，不交给重写。</text><line x1="72" y1="926" x2="1528" y2="926" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="72" y="954" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">朱红的两拍是「一定要做」的边界动作（限流、回放）；青色的五拍是「可以更好」的部分。中间那条虚线框是实测逼出来的补丁。</text><text x="1528" y="954" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="600" fill="#8A8172" text-anchor="end" letter-spacing="1.98" opacity="1">ONE A DAY · ARCHITECTURE</text></svg>