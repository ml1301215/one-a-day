<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171614"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8172"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#175F5A"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A0742A"/></marker><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F6F1E6" stroke="none" stroke-width="1" opacity="1"/><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#171614" stroke="none" stroke-width="1" opacity="0.028"/><rect x="0" y="0" width="1600" height="1000" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply"/><line x1="27" y1="34" x2="41" y2="34" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="34" y1="27" x2="34" y2="41" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1559" y1="34" x2="1573" y2="34" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1566" y1="27" x2="1566" y2="41" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="27" y1="966" x2="41" y2="966" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="34" y1="959" x2="34" y2="973" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1559" y1="966" x2="1573" y2="966" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1566" y1="959" x2="1566" y2="973" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><text x="72" y="62" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="2.42" opacity="1">FIG. 03</text><text x="1528" y="62" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="end" letter-spacing="1.6" opacity="1">一日一片 / OneADay — v4 架构</text><text x="72" y="128" font-family="'Noto Serif SC', Georgia, serif" font-size="44" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">把「像人」拆成三层能单独回滚的东西</text><text x="72" y="168" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">同一个目标换了个位置使劲：从「写得更细」改成「量得更准、挑得更狠」。</text><line x1="72" y1="200" x2="1528" y2="200" stroke="#171614" stroke-width="1.4" opacity="0.85"/><rect x="72" y="236" width="2" height="70" rx="1" fill="#175F5A" stroke="none" stroke-width="1" opacity="1"/><text x="88" y="252" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="600" fill="#8A8172" text-anchor="start" letter-spacing="1.98" opacity="1">PROMPT</text><text x="88" y="286" font-family="'Noto Serif SC', Georgia, serif" font-size="30" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">9,358 → 6,515</text><text x="88" y="306" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">字（−30%）</text><rect x="438" y="236" width="2" height="70" rx="1" fill="#175F5A" stroke="none" stroke-width="1" opacity="1"/><text x="454" y="252" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="600" fill="#8A8172" text-anchor="start" letter-spacing="1.98" opacity="1">SAMPLES</text><text x="454" y="286" font-family="'Noto Serif SC', Georgia, serif" font-size="30" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">3 → 55</text><text x="454" y="306" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">条，按话题检索</text><rect x="804" y="236" width="2" height="70" rx="1" fill="#C0392B" stroke="none" stroke-width="1" opacity="1"/><text x="820" y="252" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="600" fill="#8A8172" text-anchor="start" letter-spacing="1.98" opacity="1">CANDIDATES</text><text x="820" y="286" font-family="'Noto Serif SC', Georgia, serif" font-size="30" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">1 → 3</text><text x="820" y="306" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">同轮生成后重排</text><rect x="1170" y="236" width="2" height="70" rx="1" fill="#A0742A" stroke="none" stroke-width="1" opacity="1"/><text x="1186" y="252" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="600" fill="#8A8172" text-anchor="start" letter-spacing="1.98" opacity="1">LENGTH</text><text x="1186" y="286" font-family="'Noto Serif SC', Georgia, serif" font-size="30" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">手写 → 双源</text><text x="1186" y="306" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">语料 + 设计标尺</text><line x1="72" y1="336" x2="1528" y2="336" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="322" y="470" font-family="'Noto Serif SC', Georgia, serif" font-size="150" font-weight="700" fill="#175F5A" text-anchor="start" letter-spacing="0" opacity="0.07">01</text><text x="72" y="384" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="2.09" opacity="1">TEXTURE</text><text x="72" y="424" font-family="'Noto Serif SC', Georgia, serif" font-size="32" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">纹理</text><line x1="72" y1="444" x2="118" y2="444" stroke="#175F5A" stroke-width="2" opacity="1"/><text x="72" y="476" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">把「他说话多长、多碎」量成数字</text><text x="72" y="512" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">从 19,553 条弹幕 + 10,972 条评论里算分位数、</text><text x="72" y="533" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">标点率、连接词剂量、第一人称密度。</text><text x="72" y="554" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">编译期压成 prompt 里的一小段【数据画像】，</text><text x="72" y="575" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">同时给打分器当尺子。</text><line x1="72" y1="618" x2="470" y2="618" stroke="#D7CDB8" stroke-width="1" stroke-dasharray="3 4" opacity="1"/><text x="72" y="646" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="500" fill="#175F5A" text-anchor="start" letter-spacing="0" opacity="1">替代的是：更好的形容词。</text><text x="72" y="668" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">（不是变好，是换了个位置使劲）</text><text x="802" y="470" font-family="'Noto Serif SC', Georgia, serif" font-size="150" font-weight="700" fill="#175F5A" text-anchor="start" letter-spacing="0" opacity="0.07">02</text><text x="552" y="384" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="2.09" opacity="1">RETRIEVAL</text><text x="552" y="424" font-family="'Noto Serif SC', Georgia, serif" font-size="32" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">样本</text><line x1="552" y1="444" x2="598" y2="444" stroke="#175F5A" stroke-width="2" opacity="1"/><text x="552" y="476" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">让示例对题，而不是每轮同样三条</text><text x="552" y="512" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">55 条原创样本按「话题 × 形态」打标签。</text><text x="552" y="533" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">按用户原话判话题，取 4 条；</text><text x="552" y="554" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">上一条已讲自己 → 把「讲自己」的样本整批撤掉。</text><text x="552" y="575" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">三条一样长是最容易被识破的模板，检索要保住参差。</text><line x1="552" y1="618" x2="950" y2="618" stroke="#D7CDB8" stroke-width="1" stroke-dasharray="3 4" opacity="1"/><text x="552" y="646" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="500" fill="#175F5A" text-anchor="start" letter-spacing="0" opacity="1">替代的是：固定给同样的三条。</text><text x="552" y="668" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">（不是变好，是换了个位置使劲）</text><text x="1282" y="470" font-family="'Noto Serif SC', Georgia, serif" font-size="150" font-weight="700" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="0.07">03</text><text x="1032" y="384" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="600" fill="#C0392B" text-anchor="start" letter-spacing="2.09" opacity="1">RERANK</text><text x="1032" y="424" font-family="'Noto Serif SC', Georgia, serif" font-size="32" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">选样</text><line x1="1032" y1="444" x2="1078" y2="444" stroke="#C0392B" stroke-width="2" opacity="1"/><text x="1032" y="476" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">生成之后挑，而不是生成之前求</text><text x="1032" y="512" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">同轮 3 条候选，按「离真实分布多远 + 有没有踩旧坑」挑 1 条。</text><text x="1032" y="533" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">每个惩罚项都对应一次真实踩过的坑，注释里写了出处。</text><text x="1032" y="554" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">全出局时按「错误最轻」退回，不重写——</text><text x="1032" y="575" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.8" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">重写会把「有点糙但像人」改成「通顺但不像人」。</text><line x1="1032" y1="618" x2="1430" y2="618" stroke="#D7CDB8" stroke-width="1" stroke-dasharray="3 4" opacity="1"/><text x="1032" y="646" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="500" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">替代的是：再写一条规则。</text><text x="1032" y="668" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">（不是变好，是换了个位置使劲）</text><text x="72" y="700" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#8A8172" text-anchor="start" letter-spacing="2.42" opacity="1">DEGRADE</text><text x="164" y="700" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">三层都能单独关掉，退了会发生什么</text><rect x="72" y="712" width="440" height="62" rx="2" fill="none" stroke="#D7CDB8" stroke-width="1" stroke-dasharray="3 4" opacity="1"/><text x="86" y="734" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">texture.json 缺失</text><text x="86" y="754" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">回落到 persona.voice.reply_band（手写标尺），分数里标注 design</text><rect x="552" y="712" width="440" height="62" rx="2" fill="none" stroke="#D7CDB8" stroke-width="1" stroke-dasharray="3 4" opacity="1"/><text x="566" y="734" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">shotbank.jsonl 缺失</text><text x="566" y="754" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">只用 few_shots 13 条，检索退化成按长度挑</text><rect x="1032" y="712" width="440" height="62" rx="2" fill="none" stroke="#D7CDB8" stroke-width="1" stroke-dasharray="3 4" opacity="1"/><text x="1046" y="734" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">OAD_CANDIDATES = 1</text><text x="1046" y="754" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">退回单条生成，重排失效；mock 默认就是 1</text><line x1="72" y1="792" x2="1528" y2="792" stroke="#171614" stroke-width="1.2" opacity="1"/><text x="72" y="832" font-family="'Noto Serif SC', Georgia, serif" font-size="19" font-weight="500" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">一句话：判断层留在 prompt，纹理进数字，样本进检索，风格进选样。</text><text x="72" y="860" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">这四件事以前全挤在 9,358 字的 prompt 里，互相稀释；现在分开之后，每一层都能单独被反驳、单独被回滚。</text><line x1="72" y1="926" x2="1528" y2="926" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="72" y="954" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">读法：三层从上往下是「量 → 取 → 挑」。任何一层都能单独关掉，所以改版时能定位到具体是哪一层出了问题，而不是笼统的「不够像」。</text><text x="1528" y="954" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="600" fill="#8A8172" text-anchor="end" letter-spacing="1.98" opacity="1">ONE A DAY · ARCHITECTURE</text></svg>