<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171614"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8172"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#175F5A"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A0742A"/></marker><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F6F1E6" stroke="none" stroke-width="1" opacity="1"/><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#171614" stroke="none" stroke-width="1" opacity="0.028"/><rect x="0" y="0" width="1600" height="1000" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply"/><line x1="27" y1="34" x2="41" y2="34" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="34" y1="27" x2="34" y2="41" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1559" y1="34" x2="1573" y2="34" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1566" y1="27" x2="1566" y2="41" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="27" y1="966" x2="41" y2="966" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="34" y1="959" x2="34" y2="973" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1559" y1="966" x2="1573" y2="966" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><line x1="1566" y1="959" x2="1566" y2="973" stroke="#8A8172" stroke-width="0.8" opacity="0.5"/><text x="72" y="62" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="2.42" opacity="1">FIG. 05</text><text x="1528" y="62" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="end" letter-spacing="1.6" opacity="1">一日一片 / OneADay — v4 架构</text><text x="72" y="128" font-family="'Noto Serif SC', Georgia, serif" font-size="44" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">安全分级退役</text><text x="72" y="168" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">v3 在识别到危险时换一个人；v4 让同一个人把语气拨到最认真。</text><line x1="72" y1="200" x2="1528" y2="200" stroke="#171614" stroke-width="1.4" opacity="0.85"/><rect x="72" y="236" width="628" height="456" rx="3" fill="none" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="92" y="264" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="600" fill="#C0392B" text-anchor="start" letter-spacing="2.09" opacity="1">V3 · 分级 + 模板</text><text x="92" y="300" font-family="'Noto Serif SC', Georgia, serif" font-size="22" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">识别到危险，就换一个人</text><rect x="92" y="340" width="264" height="46" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="104" y="368.0" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">用户输入</text><path d="M 224 388 L 224 410" fill="none" stroke="#8A8172" stroke-width="1.2" marker-end="url(#ah-muted)" opacity="1"/><rect x="92" y="412" width="264" height="62" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="104" y="434" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">safety.classify()</text><text x="104" y="452" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">正则扫四类：危机 / 医疗 / 法律 / 未成年</text><path d="M 356 443 L 404 443" fill="none" stroke="#C0392B" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ah-red)" opacity="1"/><rect x="408" y="412" width="268" height="62" rx="2" fill="#171614" stroke="#171614" stroke-width="1" opacity="1"/><text x="420" y="434" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#F6F1E6" text-anchor="start" letter-spacing="0" opacity="1">写死的模板</text><text x="420" y="452" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#BFB49E" text-anchor="start" letter-spacing="0" opacity="1">不交给模型；每次都逐字相同</text><path d="M 224 474 L 224 504" fill="none" stroke="#8A8172" stroke-width="1.1" marker-end="url(#ah-muted)" opacity="1"/><rect x="92" y="508" width="264" height="62" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="104" y="530" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">humor_scale → 0</text><text x="104" y="548" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">few_shots 整批撤掉，只剩规则</text><path d="M 224 570 L 224 600" fill="none" stroke="#8A8172" stroke-width="1.1" marker-end="url(#ah-muted)" opacity="1"/><rect x="92" y="604" width="264" height="46" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="104" y="626" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">模型生成</text><text x="104" y="644" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">通顺、正确、不像人</text><text x="92" y="660" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">问题不是模板写得差，是那次切换本身：</text><text x="92" y="676" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">用户听到的是「系统识别到我危险了」，不是「这个人认真了」。</text><path d="M 704 470 L 892 470" fill="none" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah-red)" opacity="1"/><text x="798" y="458" font-family="'Noto Serif SC', Georgia, serif" font-size="20" font-weight="600" fill="#C0392B" text-anchor="middle" letter-spacing="0" opacity="1">退役</text><text x="798" y="494" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#8A8172" text-anchor="middle" letter-spacing="0.5" opacity="1">OAD_SAFETY = off</text><rect x="900" y="236" width="628" height="456" rx="3" fill="none" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="920" y="264" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="2.09" opacity="1">V4 · 性格承接（默认）</text><text x="920" y="300" font-family="'Noto Serif SC', Georgia, serif" font-size="22" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">同一个人，把语气拨到最认真</text><rect x="920" y="340" width="264" height="46" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="932" y="368.0" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">用户输入</text><path d="M 1052 388 L 1052 410" fill="none" stroke="#8A8172" stroke-width="1.2" marker-end="url(#ah-muted)" opacity="1"/><rect x="920" y="412" width="264" height="62" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="932" y="434" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">voice/retrieval</text><text x="932" y="452" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">seriousness 的样本被正常检索到</text><path d="M 1052 474 L 1052 504" fill="none" stroke="#8A8172" stroke-width="1.2" marker-end="url(#ah-muted)" opacity="1"/><rect x="920" y="508" width="264" height="62" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="932" y="530" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">3 条候选 → 重排</text><text x="932" y="548" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">没有特殊分支，没有模板</text><path d="M 1052 570 L 1052 600" fill="none" stroke="#8A8172" stroke-width="1.2" marker-end="url(#ah-muted)" opacity="1"/><rect x="920" y="604" width="264" height="46" rx="2" fill="#FBF7EC" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="932" y="626" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">模型生成</text><text x="932" y="644" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">长句、带号码、像一个人</text><rect x="1204" y="412" width="300" height="158" rx="2" fill="none" stroke="#175F5A" stroke-width="1" stroke-dasharray="4 4" opacity="1"/><text x="1220" y="434" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="600" fill="#175F5A" text-anchor="start" letter-spacing="1.87" opacity="1">SERIOUSNESS</text><text x="1220" y="456" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">收掉玩笑，不是换成播音腔</text><text x="1220" y="473" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">句子变短、变慢，说一句真话</text><text x="1220" y="490" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">给一件今晚就能做的事</text><text x="1220" y="507" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">身边具体的人优先，其次 12356</text><text x="1220" y="524" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">说完就停，不追问「现在好点了吗」</text><text x="920" y="660" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">还是那一套人格，只是把温度拨到最高——</text><text x="920" y="676" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">所以他认真起来，用的是「给动作」的方式，不是「给安慰」。</text><line x1="72" y1="712" x2="1528" y2="712" stroke="#171614" stroke-width="1.2" opacity="1"/><text x="72" y="740" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#C0392B" text-anchor="start" letter-spacing="2.42" opacity="1">COST</text><text x="124" y="740" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#4A443B" text-anchor="start" letter-spacing="0" opacity="1">撤掉之后失去了什么（诚实清单，写在 docs/safety.md §3）</text><rect x="72" y="758" width="282" height="88" rx="2" fill="none" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="86" y="782" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="104" y="782" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">确定性</text><text x="104" y="802" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">危机措辞变成模型生成，可能偏离、可能漏掉热线</text><text x="104" y="830" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#175F5A" text-anchor="start" letter-spacing="0" opacity="1">缓解：样本里写死 12356 与急诊</text><rect x="372" y="758" width="282" height="88" rx="2" fill="none" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="386" y="782" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="404" y="782" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">可审计</text><text x="404" y="802" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">出事故时不能指着某一行正则说「这里漏了」</text><text x="404" y="830" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#175F5A" text-anchor="start" letter-spacing="0" opacity="1">缓解：guard 模式可整条链路打开做对照</text><rect x="672" y="758" width="282" height="88" rx="2" fill="none" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="686" y="782" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#C0392B" text-anchor="start" letter-spacing="0" opacity="1">×</text><text x="704" y="782" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#171614" text-anchor="start" letter-spacing="0" opacity="1">硬拦截</text><text x="704" y="802" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">医疗 / 法律 / 未成年人不再有机器闸门</text><text x="704" y="830" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#175F5A" text-anchor="start" letter-spacing="0" opacity="1">缓解：人格里写着不提供，但没有强制执行</text><rect x="1008" y="758" width="520" height="88" rx="2" fill="#171614" stroke="#171614" stroke-width="1" opacity="1"/><text x="1024" y="782" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="600" fill="#BFB49E" text-anchor="start" letter-spacing="1.87" opacity="1">ROLLBACK</text><text x="1024" y="806" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600" fill="#F6F1E6" text-anchor="start" letter-spacing="0" opacity="1">OAD_SAFETY=guard</text><text x="1024" y="830" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#BFB49E" text-anchor="start" letter-spacing="0" opacity="1">行为与 v3 完全一致；代码与测试一行没删。</text><line x1="72" y1="926" x2="1528" y2="926" stroke="#D7CDB8" stroke-width="1" opacity="1"/><text x="72" y="954" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#8A8172" text-anchor="start" letter-spacing="0" opacity="1">这不是更安全，是更连贯。代价写在这里，回滚开关也写在这里——「不要安全」和「没想过代价」是两件事。</text><text x="1528" y="954" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="600" fill="#8A8172" text-anchor="end" letter-spacing="1.98" opacity="1">ONE A DAY · ARCHITECTURE</text></svg>