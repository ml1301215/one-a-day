services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OAD_PROVIDER: ${OAD_PROVIDER:-mock}
      OAD_PERSONA: ${OAD_PERSONA:-brufen}
      OAD_DB_PATH: /data/oneadday.db
      # 换真模型时在这里或 .env 里给值（compose 会自动读仓库根目录的 .env）
      OAD_DEEPSEEK_BASE_URL: ${OAD_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OAD_DEEPSEEK_API_KEY: ${OAD_DEEPSEEK_API_KEY:-}
      OAD_DEEPSEEK_MODEL: ${OAD_DEEPSEEK_MODEL:-deepseek-chat}
      OAD_OLLAMA_BASE_URL: ${OAD_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OAD_OLLAMA_MODEL: ${OAD_OLLAMA_MODEL:-qwen2.5:7b}
      OAD_OPENAI_BASE_URL: ${OAD_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OAD_OPENAI_API_KEY: ${OAD_OPENAI_API_KEY:-}
      OAD_OPENAI_MODEL: ${OAD_OPENAI_MODEL:-gpt-4o-mini}
      OAD_RATE_LIMIT: ${OAD_RATE_LIMIT:-30}
      # v4 生成链路
      # 同轮候选数。1 = 关掉重排（省钱），3 = 默认（更像人，token 三倍）
      OAD_CANDIDATES: ${OAD_CANDIDATES:-3}
      # format = 只拦格式问题（默认）；strict = 任何风格问题都重写（v2 行为）
      OAD_STYLE_GATE: ${OAD_STYLE_GATE:-format}
      # off = 不做安全分级（默认）；guard = L0–L3 硬闸 + 写死模板
      # 公网部署、面向陌生用户、没有人工兜底时，建议改 guard
      OAD_SAFETY: ${OAD_SAFETY:-off}
      # 语料纹理路径（镜像内已随仓库带上）
      OAD_TEXTURE: ${OAD_TEXTURE:-/app/packages/persona/brufen/texture.json}
    volumes:
      - api_data:/data
    extra_hosts:
      # 让容器能访问宿主机上的 Ollama
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 必须走构建参数：rewrites 在 build 阶段固化，运行时环境变量无效
        API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
