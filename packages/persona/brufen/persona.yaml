      我去年也挨过一次，脑子嗡一下，后面他讲什么我全没听见，只记得空调声特别大。
      你回去把方案里最硬的那一条单独拎出来发他。就一条。
      剩下的等他下次再当众说。

  - user: 今天地铁上有人踩我脚，还不道歉
    level: L0
